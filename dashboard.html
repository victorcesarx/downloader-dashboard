<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="app.title">WebScope - Extrator e Downloader de Mídias</title>
  <meta name="description" content="Extraia vídeos, áudios, imagens e documentos de qualquer site instantaneamente para download individual ou em lote (ZIP)." />
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    html:not(.i18n-ready) { visibility: hidden; }
  </style>

  </script>
</head>
<body>
  <div class="bg-glow"></div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="container" style="display:flex; justify-content:space-between; align-items:center; width:100%;">
      <a href="/index.html" class="brand">
        <div class="brand-icon">⚡</div>
        <span>WebScope</span>
      </a>

      <div class="nav-actions">
        <a href="/index.html" class="btn btn-secondary btn-sm" data-i18n="nav.landing">Início</a>
        <select id="lang-select" class="select-input" aria-label="Language Selector">
          <option value="pt-BR">Português</option>
          <option value="en">English</option>
        </select>
        <label class="theme-toggle" aria-label="Toggle Theme">
          <input type="checkbox" id="theme-toggle-input" />
          <span class="theme-toggle-slider"></span>
        </label>
      </div>
    </div>
  </header>

  <main class="container" style="padding-bottom: 60px;">
    <!-- Hero & Search Input -->
    <section class="hero-section">
      <h1 class="hero-title" data-i18n="app.title">WebScope - Extrator de Mídias</h1>
      <p class="hero-subtitle" data-i18n="app.subtitle">Extraia vídeos, áudios, imagens e documentos de qualquer site instantaneamente</p>

      <div class="search-box-wrapper">
        <form id="analyze-form" class="search-box">
          <span class="search-icon">🔍</span>
          <input 
            type="url" 
            id="url-input" 
            class="search-input" 
            placeholder="Cole aqui o link da página (ex: https://gofile.io/d/..., pixeldrain.com...)" 
            data-i18n-placeholder="search.placeholder"
            required 
          />
          <button type="submit" id="analyze-btn" class="btn btn-primary" data-i18n="search.analyze_btn">Analisar Link</button>
        </form>

      </div>
    </section>

    <!-- Controls Bar -->
    <section class="controls-bar">
      <div class="filter-pills">
        <button class="filter-pill active" data-filter="all" data-i18n="filters.all">Todos</button>
        <button class="filter-pill" data-filter="video" data-i18n="filters.video">Vídeos</button>
        <button class="filter-pill" data-filter="image" data-i18n="filters.image">Imagens</button>
        <button class="filter-pill" data-filter="audio" data-i18n="filters.audio">Áudios</button>
        <button class="filter-pill" data-filter="document" data-i18n="filters.document">Documentos</button>
      </div>

      <div class="bar-right">
        <button id="nsfw-btn" class="nsfw-btn" title="Toggle NSFW blur">NSFW</button>
        <input 
          type="text" 
          id="search-filter-input" 
          class="search-filter-input" 
          placeholder="Buscar mídias..." 
          data-i18n-placeholder="filters.search_input"
        />

        <div class="view-toggle">
          <button id="view-grid-btn" class="view-btn active" data-i18n-title="views.grid_title">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
          </button>
          <button id="view-list-btn" class="view-btn" data-i18n-title="views.list_title">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- Global Selection & Status Bar -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px; flex-wrap:wrap; gap:12px;">
      <div id="found-count" style="font-weight: 600; color: var(--text-secondary);">
        0 mídia(s) encontrada(s)
      </div>

      <div style="display:flex; gap:8px;">
        <button id="toggle-select-btn" class="btn btn-secondary btn-sm">Selecionar Todos</button>
        <button id="download-selected-btn" class="btn btn-primary btn-sm" disabled data-i18n="actions.download_selected">Baixar Selecionados (ZIP) <span id="total-size-display" class="total-size-info"></span></button>
      </div>
    </div>

    <!-- Media Cards Display Container -->
    <div id="media-container" class="media-container grid-view">
      <!-- Media Cards injected by renderer.js -->
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 WebScope - Downloader Dashboard. Desenvolvido com Node.js puro & Vanilla JS.</p>
    </div>
  </footer>

  <script>
    (function(){
      var lang = localStorage.getItem('downdash_lang');
      if (!lang) lang = navigator.language && navigator.language.startsWith('pt') ? 'pt-BR' : 'en';
      var dict = (window.__LOCALES__ || {})[lang];
      if (!dict) return;
      function resolve(key) {
        var parts = key.split('.'), val = dict;
        for (var i = 0; val && i < parts.length; i++) val = val[parts[i]];
        return typeof val === 'string' ? val : key;
      }
      document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = resolve(el.getAttribute('data-i18n')); });
      document.querySelectorAll('[data-i18n-html]').forEach(function(el){ el.innerHTML = resolve(el.getAttribute('data-i18n-html')); });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){ el.placeholder = resolve(el.getAttribute('data-i18n-placeholder')); });
      document.querySelectorAll('[data-i18n-title]').forEach(function(el){ el.title = resolve(el.getAttribute('data-i18n-title')); });
      document.documentElement.classList.add('i18n-ready');
    })();
  </script>
  <script type="module" src="/scripts/app.js"></script>
</body>
</html>
