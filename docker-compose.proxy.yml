services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      webscope:
        condition: service_healthy
    environment:
      WEBSCOPE_DOMAIN: "${WEBSCOPE_DOMAIN:-localhost}"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp:size=64m,mode=1777,nosuid,nodev,noexec
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  caddy-data:
  caddy-config:
