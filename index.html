<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="app.title">WebScope - Extrator e Downloader de Mídias</title>
  <meta data-i18n-content="app.description" name="description" content="WebScope permite extrair e baixar imagens, vídeos e arquivos de qualquer site de hospedagem de forma fácil e rápida." />
  <link rel="stylesheet" href="/styles/theme.css">
  <link rel="stylesheet" href="/styles/main.css?v=14">
  <style>
    html:not(.i18n-ready) { visibility: hidden; }
  </style>
  <script src="/scripts/theme.js"></script>
</head>
<body class="app-shell">
  <div class="bg-glow"></div>

  <!-- Application Bar -->
  <header class="navbar app-header">
    <div class="container app-header__inner">
      <a href="/" class="brand app-brand">
        <div class="brand-icon">⚡</div>
        <span>WebScope</span>
      </a>

      <div class="nav-actions app-header__actions">
        <a id="queue-toggle-btn" class="btn btn-secondary btn-sm queue-toggle-btn" data-i18n="nav.queue" data-i18n-aria-label="nav.queue" aria-label="Download Queue" href="#">Downloads</a>
        <button id="preferences-toggle-btn" class="btn btn-secondary btn-sm preferences-toggle-btn" type="button" data-i18n-aria-label="preferences.title" aria-label="Preferências">⚙<span data-i18n="preferences.title">Preferências</span></button>
        <button id="shortcuts-help-btn" class="btn btn-secondary btn-sm shortcuts-help-btn" type="button" data-i18n-title="shortcuts.open_help" data-i18n-aria-label="shortcuts.open_help" aria-label="Ajuda de atalhos" title="Ajuda de atalhos">?</button>
        <label class="toggle-switch toggle-switch--theme" data-i18n-aria-label="nav.theme_label" aria-label="Toggle Theme">
          <input class="toggle-switch-input" type="checkbox" id="theme-toggle-input" />
          <span class="toggle-switch-slider" aria-hidden="true"></span>
        </label>
      </div>
    </div>
  </header>

  <!-- Dashboard View -->
  <main id="view-dashboard" class="app-main">
    <!-- Área de Análise -->
    <section class="analysis-section">
      <div class="search-box-wrapper">
        <form id="analyze-form" class="analysis-command" autocomplete="off">
          <div class="search-box">
            <span class="search-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
            <input
            type="url" 
            id="url-input" 
            class="search-input" 
            placeholder="Cole aqui o link da página (ex: https://gofile.io/d/..., pixeldrain.com...)" 
            data-i18n-placeholder="search.placeholder"
            name="webscope-analysis-url"
            autocomplete="off"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            aria-autocomplete="list"
            aria-controls="url-history-dropdown"
            aria-expanded="false"
            data-form-type="other"
            data-1p-ignore="true"
            data-lpignore="true"
            required 
            />
          </div>
          <div class="search-actions">
            <button type="submit" id="analyze-btn" class="btn btn-primary" data-i18n="search.analyze_btn" data-i18n-title="search.analyze_btn"><span class="spinner"></span> Analisar Link</button>
            <button type="button" id="clear-cache-btn" class="btn btn-icon clear-cache-btn" data-i18n-title="actions.clear_cache" data-i18n-aria-label="actions.clear_cache" aria-label="Clear search cache" title="Limpar cache de pesquisa"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m13 11 9-9"/><path d="M14.6 12.6c.8.8.9 2.1.2 3L10 22l-8-8 6.4-4.8c.9-.7 2.2-.6 3 .2Z"/><path d="m6.8 10.4 6.8 6.8"/><path d="m5 17 1.4-1.4"/></svg></button>
          </div>
        </form>
        <div class="drag-overlay" data-i18n="search.drop_here">Solte a URL aqui</div>
      </div>
    </section>

    <!-- Controls Bar -->
    <section class="controls-bar">
      <div class="filter-pills">
        <button class="filter-pill active" data-filter="all" data-i18n="filters.all" data-i18n-title="filters.all">Todos</button>
        <button class="filter-pill" data-filter="video" data-i18n="filters.video" data-i18n-title="filters.video">Vídeos</button>
        <button class="filter-pill" data-filter="image" data-i18n="filters.image" data-i18n-title="filters.image">Imagens</button>
        <button class="filter-pill" data-filter="audio" data-i18n="filters.audio" data-i18n-title="filters.audio">Áudios</button>
        <button class="filter-pill" data-filter="document" data-i18n="filters.document" data-i18n-title="filters.document">Documentos</button>
      </div>

      <div class="bar-tools">
        <select id="sort-order-select" class="select-input sort-order-select" data-i18n-aria-label="sort.label" aria-label="Ordenar mídias">
          <option value="original" data-i18n="sort.original">Original</option>
          <option value="name-asc" data-i18n="sort.name_asc">Nome A–Z</option>
          <option value="name-desc" data-i18n="sort.name_desc">Nome Z–A</option>
          <option value="size-desc" data-i18n="sort.size_desc">Maior tamanho</option>
          <option value="size-asc" data-i18n="sort.size_asc">Menor tamanho</option>
          <option value="quality-desc" data-i18n="sort.quality_desc">Maior qualidade</option>
          <option value="quality-asc" data-i18n="sort.quality_asc">Menor qualidade</option>
          <option value="type" data-i18n="sort.type">Por tipo</option>
        </select>
        <input 
          type="text" 
          id="search-filter-input" 
          class="search-filter-input" 
          placeholder="Buscar mídias..." 
          data-i18n-placeholder="filters.search_input"
        />
        <button id="nsfw-btn" class="nsfw-btn" data-i18n-title="actions.nsfw_title" title="Toggle NSFW blur">NSFW</button>
        <button id="sound-btn" class="sound-btn" data-i18n-title="actions.sound" data-i18n-aria-label="actions.sound" aria-label="Completion sound" title="Completion sound"><svg class="sound-icon sound-icon-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="m16 9 6 6"/><path d="m22 9-6 6"/></svg><svg class="sound-icon sound-icon-on" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></button>
      </div>

      <div class="view-toggle">
        <button id="view-grid-btn" class="view-btn active" data-i18n-title="views.grid_title">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
        </button>
        <button id="view-compact-btn" class="view-btn" data-i18n-title="views.compact_title">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 3h4v4H3zM10 3h4v4h-4zM17 3h4v4h-4zM3 10h4v4H3zM10 10h4v4h-4zM17 10h4v4h-4zM3 17h4v4H3zM10 17h4v4h-4zM17 17h4v4h-4z"></path></svg>
        </button>
        <button id="view-list-btn" class="view-btn" data-i18n-title="views.list_title">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
      </div>
    </section>

    <!-- Global Selection & Status Bar -->
    <div class="selection-bar">
      <div id="found-count" class="found-count" data-i18n="status.found_count">
        0 mídia(s) encontrada(s)
      </div>

      <div class="selection-actions">
        <button id="toggle-select-btn" class="btn btn-secondary btn-sm" data-i18n="actions.select_all" data-i18n-title="actions.toggle_select">Selecionar Todos</button>
        <button id="invert-select-btn" class="btn btn-secondary btn-sm" data-i18n="actions.invert_selection" data-i18n-title="actions.invert_selection_title">Inverter seleção</button>
        <button id="download-selected-btn" class="btn btn-primary btn-sm" disabled data-i18n="actions.download_selected" data-i18n-title="actions.download_selected">Baixar Selecionados (ZIP) <span id="total-size-display" class="total-size-info"></span></button>
      </div>
    </div>

    <!-- Results Area -->
    <section class="results-section">
      <!-- Media Cards Display Container -->
      <div id="media-container" class="media-container grid-view">
        <!-- Media Cards injected by renderer.js -->
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p data-i18n="app.footer">&copy; 2026 WebScope - Downloader Dashboard. Desenvolvido com Node.js puro & Vanilla JS.</p>
    </div>
  </footer>

  <script type="module" src="/scripts/app.js"></script>
</body>
</html>
